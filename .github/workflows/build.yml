name: build
on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libgl-dev libxi-dev ninja-build xvfb libgl1-mesa-dri fonts-dejavu-core
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Smoke test (drives the app under Xvfb)
        run: xvfb-run -a --server-args="-screen 0 1400x900x24" python3 scripts/smoke.py build
      - name: App behaviour tests (through the action API)
        run: xvfb-run -a --server-args="-screen 0 1400x900x24" python3 scripts/app_tests.py build
      - name: CLI API tests
        run: xvfb-run -a --server-args="-screen 0 1400x900x24" python3 scripts/cli_tests.py build
      - name: API manual is current
        run: xvfb-run -a --server-args="-screen 0 1400x900x24" python3 scripts/gen_api_docs.py build --check
      - name: Package
        run: cd build && cpack -G TGZ
      - uses: actions/upload-artifact@v4
        with:
          name: firn-linux
          path: build/Firn-*.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: C:/vcpkg/installed
          key: vcpkg-${{ runner.os }}-sdl2-x64
      - name: Install SDL2
        run: vcpkg install sdl2:x64-windows
      # Warnings are errors here (/WX): nobody builds with MSVC day to day, so
      # this job is the only thing that notices a new one.
      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Build
        run: cmake --build build --config Release
      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      # The runner has no GPU and its stock OpenGL is 1.1, too old for the
      # app's 3.0 context; Mesa's llvmpipe renders in software instead.
      - name: Software OpenGL (Mesa)
        uses: ssciwr/setup-mesa-dist-win@v3
      - name: Smoke test (drives the app)
        run: python scripts/smoke.py build
      - name: App behaviour tests
        run: python scripts/app_tests.py build
      - name: CLI API tests
        run: python scripts/cli_tests.py build
      - name: Package
        run: cd build; cpack -G ZIP -C Release
      - uses: actions/upload-artifact@v4
        with:
          name: firn-windows
          path: build/Firn-*.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install sdl2 ninja
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      # The runner has a window server, so the app can actually be started
      # here: building on macOS says nothing about whether it runs. See
      # docs/ROADMAP.md, "macOS", for the bugs this caught and fixed.
      - name: Smoke test (drives the app)
        run: python3 scripts/smoke.py build
      - name: App behaviour tests
        run: python3 scripts/app_tests.py build
      - name: CLI API tests
        run: python3 scripts/cli_tests.py build
