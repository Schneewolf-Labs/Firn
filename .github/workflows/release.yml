name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04   # the oldest supported runner: the AppImage's glibc floor
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libgl-dev libxi-dev ninja-build xvfb libgl1-mesa-dri fonts-dejavu-core libfuse2
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Tests
        run: |
          ctest --test-dir build --output-on-failure
          xvfb-run -a --server-args="-screen 0 1400x900x24" python3 scripts/smoke.py build
      - name: Tarball
        run: cd build && cpack -G TGZ
      - name: AppImage
        run: |
          cmake --install build --prefix AppDir/usr
          curl -sSL -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy
          version=${GITHUB_REF_NAME#v}
          LDAI_OUTPUT="Firn-${version}-x86_64.AppImage" APPIMAGE_EXTRACT_AND_RUN=1 ./linuxdeploy --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/firn.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/firn.png --output appimage
          ls -la Firn-*.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            build/Firn-*.tar.gz
            Firn-*.AppImage

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: C:/vcpkg/installed
          key: vcpkg-${{ runner.os }}-sdl2-x64
      - name: Install SDL2
        run: vcpkg install sdl2:x64-windows
      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Build
        run: cmake --build build --config Release
      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Zip
        run: cd build; cpack -G ZIP -C Release
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/Firn-*.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install sdl2 ninja
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Tests
        run: ctest --test-dir build --output-on-failure
      - name: Tarball
        run: cd build && cpack -G TGZ
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/Firn-*.tar.gz

  publish:
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Checksums and notes
        run: |
          cd dist
          find . -type f \( -name 'Firn-*' \) -exec mv {} . \; 2>/dev/null || true
          sha256sum Firn-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          version=${GITHUB_REF_NAME#v}
          # The changelog section for this version becomes the release body.
          awk -v v="$version" '/^## /{p=($2==v)} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Firn $version" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: Firn ${{ github.ref_name }}
          body_path: notes.md
          files: |
            dist/Firn-*
            dist/SHA256SUMS.txt
